<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Control Room — Lewis &amp; Clark Expedition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <style>
    .adm-tabs { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .adm-tabs button { padding: .45rem .9rem; border: 2px solid var(--brass); background: var(--bark-dark); color: var(--parchment-light); border-radius: 4px; cursor: pointer; font-weight: 700; }
    .adm-tabs button.on { background: var(--brass); color: var(--ink); }
    .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .2rem 1rem; }
    .fgrid label.field { font-size: .88rem; }
    .fgrid .help { font-weight: 400; font-size: .78rem; color: var(--ink-soft); }
    fieldset { border: 2px solid var(--bark); border-radius: 6px; margin: 0 0 1rem; padding: .8rem 1rem; background: rgba(255,250,240,.5); }
    legend { font-family: var(--display); font-size: 1.35rem; padding: 0 .4rem; }
    .savebar { position: sticky; bottom: 0; background: var(--bark-dark); border-top: 3px solid var(--brass); padding: .6rem 1rem; display: flex; gap: .6rem; align-items: center; z-index: 10; margin-top: 1rem; border-radius: 0 0 6px 6px; }
    .savebar span { color: var(--parchment-light); }
    textarea.inp { min-height: 4.5rem; }
    .qitem { border: 2px solid #c7ad7d; border-radius: 6px; padding: .6rem .8rem; margin-bottom: .6rem; background: #fbf3df; }
    .qitem .ans { display: grid; grid-template-columns: auto 1fr; gap: .3rem .5rem; align-items: center; margin-top: .4rem; }
    table.tbl td .btn { padding: .3rem .55rem; font-size: .85rem; }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">Teacher Control Room</div><span class="small" style="color:#d4bf94">Lewis &amp; Clark Expedition</span>
    <nav class="topnav"><button id="to-game">Student game</button><button id="logout" class="hidden">Log out</button></nav></header>
  <main id="adm"></main>
  <div id="modal-root"></div>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
